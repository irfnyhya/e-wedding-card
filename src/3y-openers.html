<style>
/* ===== Rebuilt openers ===== */
/* warkah: a parchment roll with spiral ends, gold finials and a tied ribbon */
.inv .cv-skrol2{background:var(--ground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .6s .2s}
.inv .sk-to,.inv .sk-hint{position:relative;z-index:2;color:var(--pagefg);text-align:center;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:15px;transition:opacity .3s}

.inv .cyl{position:absolute;inset:0;border-radius:6px;background:linear-gradient(180deg,#8f7448 0%,#d9c398 14%,#f7ecd2 34%,#fff8e8 46%,#eadbb8 66%,#b89b6c 88%,#7a5f38 100%);box-shadow:0 18px 26px rgba(0,0,0,.45)}

.inv .cyl .end.l{left:-11px}.inv .cyl .end.r{right:-11px}
.inv .cyl .fin{position:absolute;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#d4a849 45%,#6b4a1e);box-shadow:0 3px 6px rgba(0,0,0,.45);z-index:2}

.inv .cyl .tie{position:absolute;left:50%;top:-4px;bottom:-4px;width:18px;margin-left:-9px;background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%,rgba(0,0,0,.25)),var(--accent);z-index:2}

.inv .unroll{position:absolute;left:3%;right:3%;top:50%;height:0;background:var(--sheet);box-shadow:0 10px 20px rgba(0,0,0,.35);overflow:hidden;display:flex;align-items:center;justify-content:center;transition:height 1.1s .25s cubic-bezier(.5,0,.2,1)}

.inv .cv-skrol2{container-type:size}

/* gerbang: filigree gates between stone pillars, a name plaque and a ring knocker */

.inv .cv-gate2 .gate{position:absolute;top:16%;bottom:0;width:40%;z-index:2;transition:transform 1.4s cubic-bezier(.55,0,.25,1);filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}

.inv .knock{position:absolute;left:50%;top:56%;width:54px;height:54px;transform:translate(-50%,-50%);z-index:5;border:0;padding:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fff3c4,#d4a849 45%,#6b4a1e);box-shadow:0 4px 8px rgba(0,0,0,.5);transition:opacity .3s}

.inv.opening .cv-gate2 .gate.r{transform:rotateY(78deg)}
.inv.opening .knock,.inv.opening .g-to,.inv.opening .cv-gate2 .plaque{opacity:0}
.inv .cv-gate2{transition:background-color .6s .35s}.inv.opening .cv-gate2{background-color:transparent}.inv.opening .cv-gate2 .glow{opacity:0;transition:opacity .6s .3s}

/* pawagam: a ticket in front of red velvet curtains */

.inv .curtain.l{left:0;transform-origin:0 0}.inv .curtain.r{right:0;transform-origin:100% 0}

/* jubin: a large tile medallion with names */

/* jahitan: a wooden hoop with a brass clamp */

.inv .clamp::after{content:"";position:absolute;left:50%;top:-10px;width:14px;height:12px;margin-left:-7px;border-radius:3px;background:linear-gradient(#e0e0e0,#8a8a8a)}
.inv .fabric{position:absolute;inset:18px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12%;box-shadow:inset 0 0 26px rgba(0,0,0,.18)}

/* buku: spine bands, gilt corners, a title label and a ribbon bookmark */
.inv .bk2 .spine{position:absolute;left:0;top:0;bottom:0;width:13%;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.08) 60%,rgba(0,0,0,.25)),repeating-linear-gradient(180deg,transparent 0 16%,rgba(0,0,0,.35) 16% 17%,rgba(255,255,255,.12) 17% 18%)}

/* piring hitam: a designed sleeve with ring wear and a sticker */
.inv .sl2{overflow:hidden;align-items:flex-start;text-align:left;padding:22px 20px;justify-content:flex-end}

/* baldu: a bevelled brass plate on a horizontal satin ribbon */
.inv .ribbon-h{position:absolute;left:0;right:0;top:50%;height:46px;margin-top:-23px;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.05) 40%,rgba(0,0,0,.28)),var(--ribbon);z-index:1}

/* kaca: dusk inside the window, a candle glow behind the names */
