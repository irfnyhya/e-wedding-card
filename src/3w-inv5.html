.inv .wreath i{position:absolute;left:50%;top:50%;width:30%;aspect-ratio:var(--ar);transform-origin:0 0;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.inv .wreath .mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Pinyon Script",cursive;font-size:clamp(52px,17cqi,70px)}
.inv .pg-tekat .names{font-family:"Cinzel",serif;font-weight:400;letter-spacing:.16em;text-transform:uppercase;font-size:clamp(20px,6.6cqi,26px);line-height:1.5}
.inv .pg-tekat .names .amp{display:inline;margin:0 .3em}
.inv .pg-tekat .caps,.inv .pg-tekat .small{color:var(--gold)}
.inv .cv-tekat{background:var(--ground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .7s .5s}
.inv .cv-tekat .wreath{transition:transform 1.1s cubic-bezier(.5,0,.2,1)}
.inv.opening .cv-tekat .wreath{transform:rotate(25deg) scale(1.3)}
/* label: vintage labels */
.inv .pg-label{background:var(--ground);padding:30px 20px 90px;gap:16px}
.inv .vlabel{position:relative;z-index:2;width:100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.inv .vlabel svg{width:100%;height:auto;display:block}
.inv .vlabel .in{position:absolute;inset:16% 14%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--ink)}
.inv .vlabel .names{font-size:clamp(36px,12cqi,48px)}
.inv .ribbon-b{position:relative;z-index:2;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3));width:96%}
.inv .ribbon-b svg{width:100%;height:auto;display:block}
.inv .ribbon-b span{position:absolute;inset:0 18%;display:flex;align-items:center;justify-content:center;color:var(--sheet);font-family:"Abril Fatface",serif;font-size:clamp(13px,4.4cqi,17px);letter-spacing:.08em}
.inv .cv-label{background:var(--ground);display:flex;align-items:center;justify-content:center;transition:opacity .7s .3s}
.inv .hangtag{position:relative;width:60%;border:0;padding:0;background:none;cursor:pointer;transform-origin:50% 0;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.inv .hangtag .in{position:absolute;inset:22% 12% 12%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink);text-align:center}
.inv.thumb .hangtag{animation:none}
@media (prefers-reduced-motion: reduce){.inv .disc,.inv .hangtag{animation:none}.inv .bookcov,.inv .rolled,.inv .cv-gerbang .gate,.inv .mbox .drawer,.inv .cv-telegram{transition:none}}
</style>
