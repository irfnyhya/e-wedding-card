<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sanding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@400;500&family=Pinyon+Script&family=Marcellus&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Amiri:wght@400;700&family=Aref+Ruqaa&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Poiret+One&family=IBM+Plex+Mono:wght@400;500&family=Homemade+Apple&family=Special+Elite&family=Cinzel:wght@400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&text=%E5%9B%8D&display=swap">
<style>
html,body{overflow-x:clip;max-width:100%}
/* Layout: a stationer's catalogue. Paper ground, ink type, one oxblood accent; app screens sit on the same paper. Deliberately single-theme (printed-paper look) on any host. */
:root{
  color-scheme:light;
  --bg:#f3eee5; --surface:#fbf8f2; --sunk:#ebe4d8; --fg:#221b17; --muted:#6f645a; --line:rgba(34,27,23,.16);
  --accent:#6e1a26; --accent-ink:#fbf6ee; --accent-soft:#efdcd8; --brass:#9a7a45; --danger:#a3261e; --ok:#2f6b45;
  --dark:#211a17; --dark-fg:#efe7da;
  --f-display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif; --f-body:"Jost", "Futura", "Avenir Next", system-ui, sans-serif;
  --r:2px; --shadow:0 1px 2px rgba(34,27,23,.08),0 14px 34px rgba(34,27,23,.10);
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;position:relative}
body::before{content:"";position:fixed;inset:0;background:url(assets/paper.jpg) 0 0/360px;mix-blend-mode:multiply;opacity:.7;pointer-events:none;z-index:0}
body > *{position:relative;z-index:1}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.05;text-wrap:balance;margin:0;letter-spacing:-.005em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:500}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r);padding:12px 22px;font-weight:500;cursor:pointer;text-decoration:none;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:background .15s,color .15s}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:#561420}
.btn-ghost{background:transparent;border-color:var(--fg);color:var(--fg)}
.btn-ghost:hover{background:var(--fg);color:var(--bg)}
.btn-ghost-light{background:transparent;border:1px solid rgba(239,231,218,.5);color:var(--dark-fg)}
.btn-ghost-light:hover{background:var(--dark-fg);color:var(--dark)}
.btn-link{background:none;padding:12px 2px;color:var(--fg);text-transform:none;letter-spacing:0;font-size:15px;border-bottom:1px solid var(--fg);border-radius:0}
.btn-sm{padding:8px 14px;font-size:11px}
.btn-danger{color:var(--danger);border-color:var(--line);background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tag{display:inline-block;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border:1px solid currentColor;color:var(--accent);border-radius:2px}
.tag.brass{color:var(--brass)}

/* header: a centred masthead */
.site-head{position:sticky;top:env(safe-area-inset-top, 0px);z-index:40;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.site-head .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;height:68px}
.brand{display:flex;flex-direction:column;align-items:center;text-decoration:none;line-height:1}
.brand .wm{font-family:var(--f-display);font-size:30px;font-weight:500;font-style:italic;letter-spacing:.01em}
.brand .tag-line{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.nav{display:flex;gap:4px;align-items:center}
.nav-r{justify-content:flex-end}
.nav a:not(.btn){padding:8px 10px;text-decoration:none;font-size:13px;letter-spacing:.06em;color:var(--muted)}
.nav a:not(.btn):hover,.nav a[aria-current="page"]:not(.btn){color:var(--fg)}
.nav a[aria-current="page"]:not(.btn){text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
@media (max-width:720px){.nav a.hide-sm{display:none}.brand .tag-line{display:none}.brand .wm{font-size:24px}.nav a:not(.btn){padding:6px 4px;font-size:12px}.site-head .btn-sm{padding:7px 8px;letter-spacing:.04em;font-size:10px}}

.view{display:none}
.view.on{display:block}

/* hero with a flat-lay of real cards */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:56px;align-items:center;padding-block:56px 72px}
.hero h1{font-size:clamp(42px, 6.4vw, 82px);font-weight:300;letter-spacing:-.02em}
.hero h1 em{font-style:italic;color:var(--accent);font-weight:400}
.lead{font-size:17px;color:var(--muted);max-width:50ch;line-height:1.65}
.hero .lead{margin-top:22px}
.hero .ctas{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:30px}
.hero .fine{margin-top:22px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.table{position:relative;aspect-ratio:1/1.02;background:#bfae97;overflow:hidden;box-shadow:inset 0 0 120px rgba(40,25,15,.35)}
.table::before{content:"";position:absolute;inset:0;background:url(assets/linen.jpg) 0 0/220px;mix-blend-mode:soft-light;opacity:.8}
.table .mini{position:absolute;box-shadow:0 2px 3px rgba(30,18,10,.25),0 22px 40px rgba(30,18,10,.35)}
.table .prop{position:absolute;pointer-events:none;max-width:none}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:36px;padding-block:36px 56px}}

.mini{overflow:hidden;aspect-ratio:9/16;background:var(--sunk)}
.mini .scale{position:absolute;top:0;left:0;width:360px;height:640px;transform-origin:0 0}

.band{padding-block:84px;border-top:1px solid var(--line)}
.band.sunk{background:color-mix(in srgb, var(--sunk) 70%, transparent)}
.band.dark{background:var(--dark);color:var(--dark-fg);border-top:0}
.band.dark .eyebrow{color:#d9b98a}
.band.dark .lead{color:#b9ad9e}
.band-head{display:flex;justify-content:space-between;align-items:end;gap:24px 48px;flex-wrap:wrap;margin-bottom:44px}
.band-head > div{display:flex;flex-direction:column;gap:12px}
.band h2{font-size:clamp(32px, 4.4vw, 54px);font-weight:300;max-width:20ch}
.band-head > p{max-width:42ch;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px}
.two > div:first-child{display:flex;flex-direction:column;gap:12px}
@media (max-width:860px){.two{grid-template-columns:1fr;gap:28px}}

.families{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
.fam{display:flex;flex-direction:column;gap:12px;min-width:0}
.fam .mini{position:relative;cursor:pointer;box-shadow:var(--shadow)}
.fam h3{font-size:34px;font-style:italic}
.fam .mean{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.fam p{font-size:14px;color:var(--muted)}
.dots{display:flex;gap:8px;align-items:center}
.dots button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}
.dots button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--fg)}
.dots span{font-size:13px;color:var(--muted);margin-left:4px}
@media (max-width:1000px){.families{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.families{gap:18px}.fam h3{font-size:26px}.fam p{display:none}}

.demo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:56px;align-items:center}
.demo-copy{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.demo-tabs{display:flex;gap:8px;flex-wrap:wrap}
.demo-tabs button{background:transparent;border:1px solid rgba(239,231,218,.3);color:var(--dark-fg);padding:6px 16px;cursor:pointer;font-family:var(--f-display);font-size:20px;font-style:italic;border-radius:2px}
.demo-tabs button[aria-pressed="true"]{background:var(--dark-fg);color:var(--dark)}
@media (max-width:860px){.demo{grid-template-columns:1fr;justify-items:center}}

.phone{width:300px;max-width:100%;aspect-ratio:9/19;border-radius:40px;padding:10px;background:#0e0c0b;box-shadow:0 30px 60px rgba(0,0,0,.35),inset 0 0 0 2px #2a2725;position:relative}
.phone .screen{position:relative;width:100%;height:100%;border-radius:31px;overflow:hidden;background:#fff}
.phone .notch{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:84px;height:20px;border-radius:12px;background:#0e0c0b;z-index:50}

.defs{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;margin:0}
.defs > div{padding:18px 0;border-top:1px solid var(--line)}
.defs dt{font-family:var(--f-display);font-size:24px;font-style:italic}
.defs dd{margin:4px 0 0;color:var(--muted);font-size:14px}
@media (max-width:560px){.defs{grid-template-columns:1fr}}

.pricelist{display:flex;flex-direction:column}
.price-row{padding:22px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.price-row:last-child{border-bottom:1px solid var(--line)}
.price-row .top{display:flex;align-items:baseline;gap:10px}
.price-row .top h3{font-size:32px;font-style:italic}
.price-row .top .lead-dots{flex:1;border-bottom:1px dotted var(--muted);transform:translateY(-6px);min-width:20px}
.price-row .top b{font-family:var(--f-display);font-size:32px;font-weight:400;font-variant-numeric:tabular-nums}
.price-row p{color:var(--muted);font-size:14px;max-width:60ch}
.price-row .row-cta{margin-top:6px}

.faq{display:flex;flex-direction:column}
.faq details{border-top:1px solid var(--line);padding-block:18px}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;font-family:var(--f-display);font-size:22px;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";float:right;color:var(--muted)}
.faq details[open] summary::after{content:"\2013"}
.faq details p{margin-top:8px;color:var(--muted);max-width:60ch}

.site-foot{padding-block:40px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.site-foot .wrap{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.wm-small{font-family:var(--f-display);font-style:italic;font-size:24px;color:var(--fg)}

/* designs page */
.page-head{padding-block:48px 28px}
.page-head h1{font-size:clamp(38px, 5.6vw, 64px);font-weight:300}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.design-grid{display:flex;flex-direction:column;gap:56px;padding-bottom:80px}
.fam-block{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,2.3fr);gap:32px;border-top:1px solid var(--line);padding-top:28px}
.fam-block .about{display:flex;flex-direction:column;gap:8px}
.fam-block .about h2{font-size:44px;font-style:italic;font-weight:400}
.fam-block .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
@media (max-width:860px){.fam-block{grid-template-columns:1fr}.fam-block .row{gap:12px}}
.dcard{display:flex;flex-direction:column;gap:10px;min-width:0}
.dcard .mini{position:relative;cursor:pointer;box-shadow:var(--shadow)}
.dcard .hover{position:absolute;inset:0;display:flex;align-items:end;justify-content:center;padding:14px;background:linear-gradient(transparent 60%,rgba(20,12,8,.45));opacity:0;transition:opacity .2s;z-index:2}
.dcard .mini:hover .hover,.dcard .mini:focus-visible .hover{opacity:1}
.dcard .meta{display:flex;justify-content:space-between;gap:8px;align-items:start}
.dcard h3{font-size:22px;font-style:italic}
.dcard .meta p{font-size:12px;color:var(--muted)}
@media (hover:none){.dcard .hover{opacity:1}}
@media (max-width:520px){.dcard .meta{flex-direction:column}.dcard h3{font-size:18px}.dcard .meta p{display:none}}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:48px;padding-block:28px 80px;align-items:start}
.editor .preview-col{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 84px);display:flex;flex-direction:column;align-items:center;gap:12px}
@media (max-width:940px){.editor{grid-template-columns:minmax(0,1fr)}.editor .preview-col{display:none}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 14px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:1px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.tabs button .ix{font-family:var(--f-display);font-style:italic;color:var(--accent);margin-right:6px;font-size:16px}
.panel{display:none;flex-direction:column;gap:22px}
.panel.on{display:flex}
.fieldset{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 18px}
.fieldset .full{grid-column:1/-1}
@media (max-width:560px){.fieldset{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:2px;background:var(--surface)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:1px solid var(--fg);border-color:var(--fg)}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px}
.section-title h3{font-size:26px;font-style:italic}
.tpl-groups{display:flex;flex-direction:column;gap:18px}
.tpl-group{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:start}
.tpl-group h4{margin:6px 0 0;font-family:var(--f-display);font-size:22px;font-style:italic;font-weight:400}
.tpl-group h4 small{display:block;font-family:var(--f-body);font-style:normal;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.tpl-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tpl-pick button{border:1px solid var(--line);padding:0;background:var(--surface);cursor:pointer;text-align:left;border-radius:2px;overflow:hidden}
.tpl-pick button[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
.tpl-pick .sw{height:58px}
/* design picker v2: one tile per design, colours open underneath */
.fam-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;grid-auto-flow:row dense}
.fam-tile{border:1px solid var(--line);background:var(--surface);padding:0 0 10px;cursor:pointer;text-align:left;border-radius:2px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.fam-tile:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(30,18,10,.18)}
.fam-tile[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
.fam-tile .mini,.fc-opt .mini{position:relative;pointer-events:none}
.ft-name{font-family:var(--f-display);font-size:19px;font-style:italic;padding:8px 10px 0}
.ft-mean{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:2px 10px 0}
.fam-colours{grid-column:1/-1;border:1px solid var(--line);background:var(--sunk);padding:14px;display:flex;flex-direction:column;gap:12px}
.fc-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.fc-head b{font-family:var(--f-display);font-size:22px;font-style:italic;font-weight:400}
.fc-head span{font-size:13px;color:var(--muted)}
.fc-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.fc-opt{border:1px solid var(--line);background:var(--surface);padding:0 0 6px;cursor:pointer;border-radius:2px;overflow:hidden;display:flex;flex-direction:column;font-size:12px;text-align:left}
.fc-opt span{padding:5px 7px 0}
.fc-opt[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
@media (max-width:900px){.fam-pick{grid-template-columns:repeat(3,minmax(0,1fr))}.fc-row{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.fam-pick{grid-template-columns:repeat(2,minmax(0,1fr))}.fc-row{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* design picker: real miniature cards instead of colour swatches */
.tpl-pick{grid-template-columns:repeat(4,minmax(0,1fr))}
.tpl-pick .mini{position:relative;pointer-events:none}
.tpl-pick button{transition:transform .15s,box-shadow .15s}
.tpl-pick button:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(30,18,10,.18)}
@media (max-width:560px){.tpl-pick{grid-template-columns:repeat(3,minmax(0,1fr))}}

.tpl-pick .nm{padding:6px 8px;font-size:12px}
@media (max-width:560px){.tpl-group{grid-template-columns:1fr}}
.toggle-row{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--line)}
.toggle-row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.toggle-row .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toggle-row .top b{font-family:var(--f-display);font-size:21px;font-weight:500}
.switch{position:relative;width:40px;height:22px;flex:0 0 40px;margin-top:4px}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:#d6cdbf;transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.rows{display:flex;flex-direction:column;gap:8px}
.row-line{display:grid;grid-template-columns:110px 1fr auto;gap:8px}
.row-line.c3{grid-template-columns:1fr 1fr 1fr auto}
@media (max-width:560px){.row-line.c3{grid-template-columns:1fr 1fr}}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:40px;cursor:pointer;color:var(--muted)}
.uploads{display:flex;gap:10px;flex-wrap:wrap}
.uploads .ph{position:relative;width:84px;height:84px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.uploads .ph img{width:100%;height:100%;object-fit:cover}
.uploads .ph button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.uploads label.add{width:84px;height:84px;border:1px dashed var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:12px;text-align:center}
.uploads input{display:none}
.switch-sp{flex:0 0 40px}
/* no visible scrollbars inside the phone preview or on the step tabs (still scrollable) */
.inv .scroller,.phone .screen,.phone .screen *,.tabs,#ed-tabs,.ed-tabs{scrollbar-width:none;-ms-overflow-style:none}
.inv .scroller::-webkit-scrollbar,.phone .screen::-webkit-scrollbar,.phone .screen *::-webkit-scrollbar,.tabs::-webkit-scrollbar,#ed-tabs::-webkit-scrollbar,.ed-tabs::-webkit-scrollbar{display:none;width:0;height:0}
.jawi-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
